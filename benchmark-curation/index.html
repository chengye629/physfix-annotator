  <header><div class="top"><h1>PhysFixBench v0.2 筛选核对</h1><a href="https://huggingface.co/datasets/HuggingFriends/PhysFixBench/tree/54a8b9abcf9be3e60c6d1eb9baad61aafe160e8f/data/benchmark_v0_2" target="_blank" rel="noreferrer">HF 数据目录 ↗</a></div></header>

  <script type="application/json" id="curation-data">[{"id":"PF-0005","title":"篮球穿过篮筐","kind":"rewritten","record_id":"phyground::cosmos-predict2.5-2b::mechanics_293","original_url":"https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/ce67583873c46ffd6cd679edea9b22b60683b1ec/videos/cosmos-predict2.5-2b__mechanics_293.mp4","fps":16.0,"duration":5.8125,"key":"PF-0005-c1","card":1,"reason":"原卡只接受反弹。改成检查球有没有穿过篮筐实体，保留反弹、偏转和正常入篮等可能结果。","before":[{"timestamp":"4–5.5","start_seconds":4.0,"end_seconds":5.5,"problem":"篮球击中篮筐却穿模进球","expected":"篮球被篮筐弹开"}],"after":[{"timestamp":"4–5.5","start_seconds":4.0,"end_seconds":5.5,"problem":"篮球击中篮筐却穿模进球","expected":"篮球与篮筐保持实体边界。球接触篮筐时可偏转或反弹，也可沿无穿透的连续轨迹入篮。"}]},{"id":"PF-0007","title":"马克杯落地变形","kind":"rewritten","record_id":"phyground::ltx-2.3-22b-dev-1stage::0125_perspective-center_trimmed-mug-breaks","original_url":"https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/ce67583873c46ffd6cd679edea9b22b60683b1ec/videos/ltx-2.3-22b-dev-1stage__0125_perspective-center_trimmed-mug-breaks.mp4","fps":25.0,"duration":3.88,"key":"PF-0007-c1","card":1,"reason":"把笼统的“异常”落到画面可对照的杯身变形和反复跃起。碰撞后允许翻倒、反弹或脆裂。","before":[{"timestamp":"0.25–3.75","start_seconds":0.25,"end_seconds":3.75,"problem":"松开的马克杯触地面异常变形和弹起","expected":"马克杯应连续加速下落，撞砖后摔成陶瓷碎片"}],"after":[{"timestamp":"0.25–3.75","start_seconds":0.25,"end_seconds":3.75,"problem":"黄色马克杯落到砖块后多次向上跃起，杯身在跃起中明显变形。","expected":"杯身在接触前保持刚性。接触砖块后可翻倒、短暂反弹或脆裂，后续运动应与碰撞和重力连续，杯身不应像软物一样反复扭曲。"}]},{"id":"PF-0019","title":"锤子消失后重现","kind":"rewritten","record_id":"phyground::wan2.2-i2v-a14b::mechanics_193","original_url":"https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/ce67583873c46ffd6cd679edea9b22b60683b1ec/videos/wan2.2-i2v-a14b__mechanics_193.mp4","fps":16.0,"duration":5.0625,"key":"PF-0019-c1","card":1,"reason":"优先检查可定位的消失和轨迹断裂。出画、遮挡、正常弹跳都可以发生。","before":[{"timestamp":"0.75–2.5","start_seconds":0.75,"end_seconds":2.5,"problem":"锤子弹的高度太高了，空中的锤子完全消失一秒多，后在画面顶部突现","expected":"锤子本身没有那么高的弹性，锤子应全程可见，弹跳一次后落定倾倒"}],"after":[{"timestamp":"0.75–2.5","start_seconds":0.75,"end_seconds":2.5,"problem":"锤子在画面内飞行时消失，随后在画面上部重新出现，前后位置和轨迹不连续。","expected":"锤子的运动应有连续轨迹。若离开画面或被遮挡，再出现的位置和方向需要与离开前的运动衔接。"}]},{"id":"PF-0034","title":"金属球卸压后的形状","kind":"rewritten","record_id":"physion_eval::full::T1_00862","original_url":"https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/ce67583873c46ffd6cd679edea9b22b60683b1ec/videos/T1_00862.mp4","fps":24.0,"duration":7.791666666666667,"key":"PF-0034-c1","card":1,"reason":"塑性变形会保留，但卸压可以伴有小幅弹性回弹。","before":[{"timestamp":"7.3–7.7","start_seconds":7.3,"end_seconds":7.7,"problem":"压扁铁球卸压后自行回缩增厚","expected":"扁平铁球卸压后应保持塑性变形"}],"after":[{"timestamp":"7.3–7.7","start_seconds":7.3,"end_seconds":7.7,"problem":"压扁铁球卸压后自行回缩增厚","expected":"卸压后允许有小幅弹性回弹，压出的明显变形应保留。"}]},{"id":"PF-0044","title":"融水增加，冰块没缩小","kind":"rewritten","record_id":"physion_eval::full::T1_01968","original_url":"https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/ce67583873c46ffd6cd679edea9b22b60683b1ec/videos/T1_01968.mp4","fps":24.0,"duration":5.666666666666667,"key":"PF-0044-c1","card":1,"reason":"保留冰水变化不匹配的现象。仅靠颜色很难判断融水中是否有色素或其他液体。","before":[{"timestamp":"0.0–5.5","start_seconds":0.0,"end_seconds":5.5,"problem":"杯中液体持续增多，冰块体积却没有相应缩小。而且透明冰并融化产生的液体是黄色。","expected":"杯中液面与液体体积和冰块体积的关系应保持稳定或相匹配的变化，冰融化产生的液体应该透明。"}],"after":[{"timestamp":"0.0–5.5","start_seconds":0.0,"end_seconds":5.5,"problem":"杯内由融冰产生的液体继续增多，但冰块没有出现相应的缩小。","expected":"冰块逐渐缩小，融水的增加应与融化的冰量大致对应。"}]},{"id":"PF-0054","title":"红蜡笔熔平后重新变尖","kind":"rewritten","record_id":"physion_eval::full::T1_05106","original_url":"https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/ce67583873c46ffd6cd679edea9b22b60683b1ec/videos/T1_05106.mp4","fps":24.0,"duration":4.833333333333333,"key":"PF-0054-c1","card":1,"reason":"统一物体名称为红蜡笔，判据聚焦于已经熔平的尖端是否无故恢复。","before":[{"timestamp":"4.0–4.7","start_seconds":4.0,"end_seconds":4.7,"problem":"左端红蜡笔融平后又自行长回尖头","expected":"蜡烛应该整体融化"}], 99","reason":"释放后可能保留横向速度，参考答案不能据此排除合理轨迹。","check":"逐帧看释放前是否已有横向速度，以及释放后轨迹是否连续。横向位移本身可以是正常抛物运动。","before":[{"timestamp":"2.75-3.05","start_seconds":2.75,"end_seconds":3.05,"problem":"物体不是自由下落","expected":"夹爪释放时，物体应该是自由下落，而不是直接有水平速度落到其他地方。"}],"after":[]},{"id":"PF-0130","title":"高尔夫球影子太长","kind":"held","record_id":"phyground::cosmos-predict2.5-14b::mechanics_35","original_url":"https://huggingface.co/datasets/juyil/PhysFixBench-PhyGround-VideoPhy2/resolve/04c5f57a99305b5a0bcf270e553a281463e29eb7/videos/cosmos-predict2.5-14b__mechanics_35.mp4","fps":16.0,"duration":5.8125,"key":"PF-0130","reason":"低角度光照可产生很长的阴影，画面不足以确定其应有形状。","check":"把球影与同画面其他阴影对照。低角度光本身可以拉长投影，缺少光源和受光面信息时难以给出唯一形状。","before":[{"timestamp":"1.25–5.5","start_seconds":1.25,"end_seconds":5.5,"problem":"滚动的高尔夫球投下窄长尖头的刀片状阴影","expected":"阴影应为圆润拉长的投影，与阳光方向和球的位置高度一致"}],"after":[]},{"id":"PF-0163","title":"偏心堆叠没有翻倒","kind":"held","record_id":"phyground::omniweaving::0182_perspective-center_trimmed-unstable-block-stack","original_url":"https://huggingface.co/datasets/juyil/PhysFixBench-PhyGround-VideoPhy2/resolve/04c5f57a99305b5a0bcf270e553a281463e29eb7/videos/omniweaving__0182_perspective-center_trimmed-unstable-block-stack.mp4","fps":16.0,"duration":5.0625,"key":"PF-0163","reason":"堆叠静止时上块落点和下块支撑投影不足以证明必须倾覆。","check":"看蓝块落稳后的接触位置，以及整体重心是否能确认已超出下方支撑。画面只有限定的观察角度。","before":[{"timestamp":"1.75–2.25","start_seconds":1.75,"end_seconds":2.25,"problem":"蓝块松开后突然左转平躺，偏心受压的黄块却纹丝不动","expected":"黄块应向受压的右端倾翻，蓝块随之跌落并在桌上停稳"}],"after":[]},{"id":"PF-0166","title":"钢珠撞板的火花与凹坑","kind":"held","record_id":"phyground::veo-3.1::collision_542","original_url":"https://chengye629.github.io/physfix-annotator-media/videos/1ab7aa98738227f18995c89d1bc12b633ae8ec42daa8c8ec4d7257c19f3f9fa1.mp4","fps":24.0,"duration":8.0,"key":"PF-0166","reason":"无法从画面可靠确定碰撞材料、速度和合理火花范围。","check":"看能否从画面明确识别板材、碰撞速度和凹坑材质变化。仅说火花“太夸张”很难稳定评分。","before":[{"timestamp":"2.25–3.75","start_seconds":2.25,"end_seconds":3.75,"problem":"钢珠撞板时火花碎屑爆发，留下熔融状凹坑 太夸张了","expected":"金属板应塑性变形出局部圆形凹痕，几乎无火花"}],"after":[]},{"id":"PF-0170","title":"排球反弹太低","kind":"held","record_id":"phyground::wan2.2-ti2v-5b::collision_446","original_url":"https://huggingface.co/datasets/juyil/PhysFixBench-PhyGround-VideoPhy2/resolve/04c5f57a99305b5a0bcf270e553a281463e29eb7/videos/wan2.2-ti2v-5b__collision_446.mp4","fps":16.0,"duration":5.0625,"key":"PF-0170","reason":"反弹高度受压力、材料和入射速度影响，低反弹本身不是明确违规。","check":"看触地后的位移和球体压缩。虽然弹得不高，充气压力和地面材料未知时很难规定反弹下限。","before":[{"timestamp":"1.0–2.25","start_seconds":1.0,"end_seconds":2.25,"problem":"充气排球砸向硬地后几乎不反弹，只微微一跳就贴地","expected":"排球触地应短暂压扁后弹起，再逐次降低弹跳高度"}],"after":[]},{"id":"PF-0175","title":"鞭炮燃烧但没炸响","kind":"held","record_id":"physion_eval::full::T1_04808","original_url":"https://huggingface.co/datasets/HuggingFriends/PhysFixBench/resolve/ce67583873c46ffd6cd679edea9b22b60683b1ec/videos/0807_physion_eval_full_T1_04808.mp4","fps":24.0,"duration":7.791666666666667,"key":"PF-0175","reason":"画面显示燃烧和烟雾，但无法排除哑火或仅点燃了部分引线。","check":"看是否能确认引线烧到主体，而不只是持续冒烟。哑火或仅部分引线燃烧都有可能。","before":[{"timestamp":"0.2–3.4","start_seconds":0.2,"end_seconds":3.4,"problem":"引线点燃后，红色鞭炮串在第0.2至3.4秒始终原样铺在草地上，仅左端定点持续燃烧并冒出巨量白烟，没有出现爆炸应有的短促火光冲击、爆裂跳动或碎片散开；烟在6.7秒后散尽时整串鞭炮仍完好保持原排列","expected":"引线点燃后，鞭炮串应在该时段出现清晰而短促的爆炸过程，伴随火光、鞭炮本体的爆裂和受力位移，而不是只在固定端持续燃烧并形成巨量烟团"}],"after":[]}]</script>
  <script>
    const items = JSON.parse(document.querySelector('#curation-data').textContent);
    const $ = id => document.getElementById(id);
    const video = $('video');
    const tabs = [...document.querySelectorAll('[data-kind]')];
    const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
    let active = items.find(item => item.key === location.hash.slice(1)) ?? items.find(item => item.kind === 'held');
    let kind = active.kind;
    let playStop = null;
    let pending = null;
    let loaded = '';

    function match() {
      const query = $('search').value.trim().toLowerCase();
      return items.filter(item => item.kind === kind && JSON.stringify(item).toLowerCase().includes(query));
    }
    function showStatus(message = '') {
      $('video-status').textContent = message;
      $('video-status').hidden = !message;
    }
    function range(card) {
      if (card.inspection_window_seconds) return card.inspection_window_seconds;
      if (card.start_seconds === card.end_seconds) return [Math.max(0, card.start_seconds - .25), Math.min(active.duration, card.end_seconds + .25)];
      return [card.start_seconds, card.end_seconds];
    }
    function cardHTML(card, index, side) {
      const label = side === 'after' ? '改写后' : (active.kind === 'held' ? '原通过卡片' : '改写前');
      const [start, end] = range(card);
      return `<article class="panel card ${side}"><div class="card-top"><h3>${label} · 卡片 ${active.card ?? index + 1}</h3><button type="button" class="jump" data-start="${start}" data-end="${end}" title="从标注开始播放，到片段末暂停">▶ ${escape(card.timestamp)} 秒</button></div><dl><dt>物理问题</dt><dd>${escape(card.problem)}</dd><dt>修改后应有的正确状态</dt><dd>${escape(card.expected)}</dd></dl></article>`;
    }
    function render() {
      const visible = match();
      if (!visible.some(item => item.key === active?.key)) active = visible[0];
      tabs.forEach(tab => tab.setAttribute('aria-pressed', String(tab.dataset.kind === kind)));
      $('queue').innerHTML = visible.map(item => `<button type="button" class="case" data-key="${escape(item.key)}" aria-current="${String(item.key === active?.key)}"><span>${escape(item.title)}</span><small>${escape(item.id)}${item.card ? ' · 卡片 ' + item.card : ''}</small></button>`).join('');
      $('no-results').hidden = !!active;
      $('detail').hidden = !active;
      if (!active) { video.pause(); return; }
      const key = active.key;
      if (location.hash !== '#' + key) history.replaceState(null, '', '#' + key);
      $('case-title').textContent = `${active.id} · ${active.title}`;
      $('record-id').textContent = active.record_id;
      $('original').href = active.original_url;
      const index = visible.findIndex(item => item.key === key);
      $('prev').disabled = index <= 0;
      $('next').disabled = index >= visible.length - 1;
      const reasonTitle = active.kind === 'held' ? '暂缓收录的理由' : (active.kind === 'removed' ? '移除这张卡片的理由' : '改写理由');
      $('notes').innerHTML = `<div class="panel reason"><h3>${reasonTitle}</h3><p>${escape(active.reason)}</p>${active.check ? `<p class="check"><strong>看片时可核对</strong> ${escape(active.check)}</p>` : ''}${active.kind === 'held' ? '<p class="subtle">此条原复核通过，暂缓计入 v0.2。</p>' : ''}</div>` + active.before.map((card, i) => cardHTML(card, i, 'before')).join('') + active.after.map((card, i) => cardHTML(card, i, 'after')).join('');
      if (loaded !== key) {
        video.pause();
        playStop = pending = null;
        showStatus();
        loaded = key;
        video.src = `./videos/${active.id}.mp4`;
        video.load();
        $('time').textContent = `0.00 / ${active.duration.toFixed(2)} s`;
      }
    }
    function move(offset) {
      const visible = match();
      const next = visible[visible.findIndex(item => item.key === active?.key) + offset];
      if (next) { active = next; render(); document.querySelector('[aria-current="true"]')?.scrollIntoView({block:'nearest'}); }
    }
    function playSegment(start, end) {
      if (video.readyState < 1) { pending = [start, end]; return; }
      video.currentTime = Math.max(0, Math.min(start, video.duration - .01));
      playStop = Math.min(end, video.duration);
      video.play().catch(() => showStatus('片段已定位。点视频播放按钮继续。'));
    }
    function step(direction) {
      if (video.readyState < 1) return;
      playStop = pending = null;
      video.pause();
      video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + direction / active.fps));
    }
    video.addEventListener('loadedmetadata', () => {
      video.playbackRate = Number($('speed').value);
      if (pending) { const segment = pending; pending = null; playSegment(...segment); }
    });
    video.addEventListener('timeupdate', () => {
      if (playStop !== null && video.currentTime >= playStop) { video.pause(); playStop = null; }
      $('time').textContent = `${video.currentTime.toFixed(2)} / ${Number.isFinite(video.duration) ? video.duration.toFixed(2) : '—'} s`;
    });
    video.addEventListener('error', () => showStatus('预览未能加载，可点「上游原视频」打开。'));
    $('queue').addEventListener('click', event => {
      const button = event.target.closest('[data-key]');
      if (button) { active = items.find(item => item.key === button.dataset.key); render(); document.querySelector('[aria-current="true"]')?.focus({preventScroll:true}); }
    });
    $('notes').addEventListener('click', event => {
      const button = event.target.closest('[data-start]');
      if (button) playSegment(Number(button.dataset.start), Number(button.dataset.end));
    });
    tabs.forEach(tab => tab.addEventListener('click', () => { kind = tab.dataset.kind; $('search').value = ''; render(); }));
    $('search').addEventListener('input', render);
    $('prev').addEventListener('click', () => move(-1));
    $('next').addEventListener('click', () => move(1));
    $('back-frame').addEventListener('click', () => step(-1));
    $('forward-frame').addEventListener('click', () => step(1));
    $('speed').addEventListener('change', () => { video.playbackRate = Number($('speed').value); });
    render();
  </script>
</body>

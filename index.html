<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频标注</title><link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=4-cards"><script type="module" src="./app.js?v=4-cards"></script>
</head>
<body>
  <header>
    <strong>视频标注</strong><label>标注人 <input id="annotator-name" maxlength="32" placeholder="姓名" autocomplete="nickname" required></label><span id="progress">0 / 300</span>
    <div class="header-actions"><button id="export-button">导出 JSON</button><button id="restore-button">导入备份</button><button id="merge-button">汇总</button></div>
  </header>
  <div class="layout">
    <aside>
      <select id="group-filter" aria-label="任务分组"><option value="all">全部 300 条</option><option value="0">1–50</option><option value="1">51–100</option><option value="2">101–150</option><option value="3">151–200</option><option value="4">201–250</option><option value="5">251–300</option></select>
      <select id="status-filter" aria-label="任务状态"><option value="all">全部</option><option value="pending">未提交</option><option value="submitted">已提交</option></select>
      <input id="search" type="search" placeholder="搜索编号" aria-label="搜索编号"><div id="queue" aria-label="视频列表">加载中…</div>
    </aside>
    <main>
      <p id="load-error" class="error" role="alert" hidden></p>
      <div id="workspace" hidden>
        <section class="video-panel">
          <div class="sample-heading"><strong id="sample-id"></strong><span id="sample-position"></span><button id="prev-button">上一条</button><button id="next-button">下一条</button></div>
          <video id="video" controls playsinline preload="auto" aria-label="待标注视频"></video>
          <div class="video-tools"><button id="frame-back" title="后退 1/30 秒">−1 帧</button><button id="frame-forward" title="前进 1/30 秒">+1 帧</button><span id="video-time">0.00 / — s</span><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></div>
          <div class="video-tools delivery-tools"><span id="video-load-status" role="status"></span><button id="retry-video">重载</button><select id="video-source" aria-label="视频线路"><option value="auto">自动线路</option><option value="site">网站线路</option><option value="original">HF 原站</option></select></div>
        </section>
        <section class="annotation-panel" aria-label="问题标注">
          <form id="annotation-form" novalidate>
            <div class="annotation-heading"><strong>问题卡片</strong><span id="draft-status" role="status"></span></div>
            <div id="issues"></div><button type="button" id="add-issue">+ 添加问题</button>
            <p id="form-error" class="error" role="alert" hidden></p>
            <div class="submission-actions">
              <button type="submit" name="verdict" value="pass" class="primary">通过</button>
              <button type="submit" name="verdict" value="reject_no_clear_issue">拒绝：没有明确、无争议的物理问题</button>
              <button type="submit" name="verdict" value="reject_poor_quality">拒绝：整体质量太差，物理问题过多</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <dialog id="merge-dialog">
    <div class="dialog-heading"><strong>结果汇总</strong><button id="close-merge">关闭</button></div>
    <div class="merge-tools"><button id="merge-import">导入多人 JSON</button><label>最少人数 <select id="minimum-reviews"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label></div>
    <p id="merge-status">未导入</p><div class="table-scroll"><table><thead><tr><th>视频</th><th>判定</th><th>状态</th><th>卡片</th></tr></thead><tbody id="merge-body"></tbody></table></div>
    <div class="merge-tools"><button id="merge-export" disabled>导出全部汇总</button><button id="merge-export-valid" disabled>导出一致通过</button></div>
  </dialog>
  <div id="toast" role="status" hidden></div><input id="restore-file" type="file" accept=".json,application/json" hidden><input id="merge-file" type="file" accept=".json,application/json" multiple hidden>
  <noscript>请启用 JavaScript。</noscript>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核统计</title><link rel="stylesheet" href="./style.css?v=19-quality"><link rel="stylesheet" href="./review.css?v=19-quality"><script type="module" src="./quality-page.js?v=19-quality"></script><style>.quality-main{max-width:1500px;margin:auto}.quality-total{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px}.quality-total article{background:white;border:1px solid var(--line);border-radius:12px;padding:18px 24px;min-width:190px}.quality-total strong{font-size:28px;color:var(--accent);display:block}.quality-note{max-width:1050px;color:#506078}.quality-main details{margin-top:25px;background:#fff;padding:18px;border:1px solid var(--line);border-radius:12px}.quality-main details input{margin:16px 0}.quality-main td{white-space:nowrap}.quality-main .video-key{white-space:normal;overflow-wrap:anywhere;max-width:480px}.quality-main table{background:#fff}.quality-main h2{font-size:17px}</style></head><body>
<section id="review-entry"><form class="entry-card" id="quality-login"><h1>审核统计</h1><label for="quality-name">管理员姓名</label><input id="quality-name" required autocomplete="name"><p id="quality-login-error" class="error" hidden></p><button>进入</button><a href="./">返回标注</a></form></section>
<div id="quality-app" hidden><header><strong>审核统计</strong><span id="quality-person"></span><div class="header-actions"><a class="button" href="./">返回标注</a><a class="button" href="./review.html">管理员复核</a><button id="quality-refresh">刷新</button><button id="quality-export">导出 JSON</button></div></header><main class="quality-main"><p id="quality-error" class="error" hidden></p><div class="quality-total" id="quality-total"></div><p class="quality-note">Precision＝初审通过的人工复核样本中，视频可保留（含需改卡片）的比例。未审核、暂不确定及过期复核不计入分母。</p><div class="table-scroll"><table><thead><tr><th>标注员</th><th>已提交</th><th>初审通过</th><th>通过样本复核数</th><th>视频可保留</th><th>审核拒绝</th><th>Precision</th><th>最终审核通过</th><th>待改卡片</th></tr></thead><tbody id="quality-rows"></tbody></table></div><p class="quality-note">历史抽查与本轮疑点复核合并统计，样本并非统一随机抽取。比较人员时请同时参考复核数量；待改卡片不计入最终审核通过数。</p><p id="quality-time" class="quality-note"></p><details><summary>视频来源与生成模型（管理员）</summary><input id="model-search" type="search" placeholder="搜索编号、数据集或模型"><p id="model-count"></p><div class="table-scroll"><table><thead><tr><th>原始编号</th><th>数据集</th><th>生成模型</th><th>原始模型标签</th></tr></thead><tbody id="model-rows"></tbody></table></div></details></main></div></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员复核</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css?v=18-review"><link rel="stylesheet" href="./review.css?v=18-review"><script type="module" src="./review.js?v=18-review"></script></head><body>
<section id="review-entry"><form class="entry-card" id="review-login"><h1>管理员复核</h1><label for="review-name">姓名</label><input id="review-name" autocomplete="name" placeholder="中文姓名或英文拼音" required><p id="login-error" class="error" hidden></p><button type="submit">进入复核</button><a href="./">返回标注</a></form></section>
<div id="review-app" hidden><header><strong>管理员复核</strong><span id="reviewer-name"></span><span id="review-progress" role="status"></span><div class="header-actions"><a class="button" href="./">返回标注</a><button id="refresh-reviews">刷新</button><button id="export-reviews">导出 JSON</button></div></header>
<div class="review-stats" id="review-stats"></div><div class="layout"><aside><select id="review-person" aria-label="复核人"></select><select id="review-filter" aria-label="复核状态"><option value="pending">未完成</option><option value="all">全部</option><option value="submitted">已完成</option></select><input id="review-search" type="search" placeholder="搜索原始编号" aria-label="搜索原始编号"><div id="review-queue"></div></aside>
<main><p id="review-error" class="error" role="alert" hidden></p><div id="review-workspace" hidden><section class="video-panel"><div class="sample-heading"><strong id="review-id"></strong><button id="review-prev">上一条</button><button id="review-next">下一条</button></div><video id="review-video" controls playsinline preload="auto"></video><div class="video-tools"><button id="review-back">−1 帧</button><button id="review-forward">+1 帧</button><span id="review-time">0.00 / — s</span><select id="review-speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></div><div class="video-tools"><span id="review-video-status" role="status"></span><button id="review-reload">重载</button><select id="review-source" aria-label="视频线路"><option value="auto">自动线路</option><option value="site">网站线路</option><option value="original">HF 原站</option></select></div><div class="audit-opinion"><strong id="audit-recommendation"></strong><p id="audit-reason"></p></div><details class="original-cards"><summary>查看原标注</summary><div id="review-original"></div></details></section>
<section class="annotation-panel"><div class="annotation-heading"><strong>问题卡片</strong><span id="review-save-status" role="status"></span></div><p id="review-readonly" hidden>此任务分配给其他管理员，仅供查看。</p><p id="review-source-changed" class="error" hidden>原标注已更新，请重新核对。</p><form id="review-form"><div id="review-cards"></div><button type="button" id="review-add">+ 添加问题</button><label class="review-note">复核意见<textarea id="review-note" rows="2" maxlength="4000"></textarea></label><div class="submission-actions"><button type="submit" value="pass" class="primary">确认通过</button><button type="submit" value="pass_modified" class="modified-pass">修改卡片后通过</button><button type="submit" value="reject_no_clear_issue">拒绝：没有明确、无争议的物理问题</button><button type="submit" value="reject_poor_quality">拒绝：整体质量太差，物理问题过多</button></div></form></section></div><p id="review-empty" hidden>当前没有待复核任务。</p></main></div></div><div id="toast" role="status" hidden></div></body></html>
